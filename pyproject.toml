[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gravwatch"
version = "2.0.0"
description = "Multi-account Google Antigravity CLI quota monitoring & telemetry engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "shadow-x78", email = "shadow-x78@users.noreply.github.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Topic :: System :: Monitoring"
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "requests>=2.31.0"
]

[project.urls]
Homepage = "https://github.com/shadow-x78/grav-watch"
Repository = "https://github.com/shadow-x78/grav-watch.git"
Issues = "https://github.com/shadow-x78/grav-watch/issues"
Changelog = "https://github.com/shadow-x78/grav-watch/blob/main/CHANGELOG.md"
