name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Python Backend & Agent Testing
  # -------------------------------------------------------------
  test-python:
    name: Backend & Agent Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt -r agent/requirements.txt

      - name: Run Unit & Integration Tests
        run: |
          PYTHONPATH="server:agent" python -m unittest discover -s tests -v

  # -------------------------------------------------------------
  # Job 2: Docker Compose Config Validation
  # -------------------------------------------------------------
  validate-docker:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
