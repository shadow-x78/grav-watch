[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gravwatch"
version = "1.0.0"
description = "Multi-account Google Antigravity CLI quota monitoring & telemetry engine"
readme = "README.md"
authors = [
    { name = "shadow-x78", email = "shadow-x78@users.noreply.github.com" }
]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
keywords = ["antigravity", "cli", "quota", "monitoring", "telemetry", "multi-account", "fastapi", "docker"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities"
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0"
]

[project.urls]
Homepage = "https://github.com/shadow-x78/grav-watch"
Repository = "https://github.com/shadow-x78/grav-watch.git"
Issues = "https://github.com/shadow-x78/grav-watch/issues"
Documentation = "https://github.com/shadow-x78/grav-watch/tree/main/docs"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
