# GravWatch Multi-Account Container Stack (GPL-3.0-or-later)
# https://github.com/shadow-x78/grav-watch

# IMPORTANT: Account containers are dynamically provisioned by the server on demand.
# Do NOT add container services here — they are created automatically when you
# pair a Google account from the Dashboard UI.

services:
  server:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile.server
    container_name: gravwatch-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/gravwatch.db
      - DATA_DIR=/app/data
      - HOST_DATA_DIR=/home/shadow-x7/Projects/Tools/Python/GravWatch/data
      - API_BIND_HOST=0.0.0.0
      - MASTER_API_KEY=gravwatch_default_key_change_me
    volumes:
      - ${GRAVWATCH_DATA_DIR:-../../data}:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gravwatch-net
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 3s
      retries: 3

  web:
    build:
      context: ../..
      dockerfile: packaging/docker/Dockerfile.web
    container_name: gravwatch-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=
      - NEXT_PUBLIC_BACKEND_URL=
      - BACKEND_INTERNAL_URL=http://server:8000
      - MASTER_API_KEY=gravwatch_default_key_change_me
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    networks:
      - gravwatch-net

networks:
  gravwatch-net:
    name: gravwatch-net
    driver: bridge
